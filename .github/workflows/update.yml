name: Update servers

on:
  schedule:
    - cron: "17 */3 * * *"   # كل 3 ساعات
  workflow_dispatch:          # تشغيل يدوي من تبويب Actions
  push:
    branches: [main]
    paths: ["scripts/**", "sources.txt", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download GeoIP database
        run: curl -sSL --retry 3 -o Country.mmdb https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-Country.mmdb

      - name: Download Xray-core
        run: |
          curl -sSL --retry 3 -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p xray && unzip -q -o xray.zip -d xray && chmod +x xray/xray && ./xray/xray version | head -1

      - name: Collect, test & split
        run: python scripts/collect.py --sources sources.txt --mmdb Country.mmdb --xray ./xray/xray --out out

      - name: Publish to "subs" branch
        run: |
          cd out
          git init -q -b subs
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" subs

      # GitHub بيوقف الجدولة لو الريبو مفيهوش نشاط 60 يوم — ده بيمنع كده
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q --allow-empty -m "keepalive"
            git push -q
          fi
